name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0). Leave blank to use run id.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore InstantFind.sln

      - name: Test
        run: dotnet test InstantFind.sln -c Release --no-restore --verbosity normal

      - name: Publish win-x64 (self-contained)
        run: |
          dotnet publish src/InstantFind/InstantFind.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/InstantFind

      - name: Zip artifact
        shell: pwsh
        run: |
          Compress-Archive -Path publish/InstantFind/* -DestinationPath InstantFind-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstantFind-win-x64
          path: InstantFind-win-x64.zip

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            V="${{ github.event.inputs.version }}"
            [[ "$V" == v* ]] || V="v$V"
            echo "tag=$V" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Instant Find ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: InstantFind-win-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
